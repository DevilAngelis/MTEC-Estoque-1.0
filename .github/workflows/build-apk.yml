name: Build APK Release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # SEM --ignore-scripts: garante postinstall dos plugins Capacitor
      - name: Instalar dependencias
        run: npm install --legacy-peer-deps

      - name: Preparar www
        run: node copy-web.js

      - name: Verificar www/index.html
        run: |
          if [ ! -f "www/index.html" ]; then echo "ERRO: www/index.html nao gerado"; exit 1; fi
          echo "OK: $(wc -c < www/index.html) bytes"

      # cap sync registra @capacitor/filesystem e @capacitor/share no Android
      - name: Sync Capacitor
        run: npx cap sync android

      - name: Verificar plugins registrados
        run: |
          cat android/app/capacitor.build.gradle
          cat android/capacitor.settings.gradle

      - name: Permissao gradlew
        run: chmod +x android/gradlew

      - name: Criar keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/mtec-release.keystore

      - name: local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build APK Release
        run: cd android && ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verificar APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then echo "ERRO: APK nao encontrado"; exit 1; fi
          echo "OK: APK $(du -h $APK | cut -f1)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MTEC-Estoque
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30
